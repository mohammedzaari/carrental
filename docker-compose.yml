version: '3.8'

services:
  database:
    image: mysql:8.3
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zaari_cars
      MYSQL_USER: Mohamed
      MYSQL_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
  minio:
      image: minio/minio:latest
      command: server /data --console-address ":9001"
      environment:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
      ports:
        - "9000:9000"
        - "9001:9001"
      volumes:
        - minio-data:/data
volumes:
  mysql-data:
  minio-data: